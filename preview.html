<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RNUI Design System Preview - Refined</title>
    <style>
      :root {
        --font-family:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      }
      body {
        font-family: var(--font-family);
        margin: 0;
        padding: 40px;
        background: #f8fafc;
        color: #1e293b;
        line-height: 1.5;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      .subtitle {
        color: #64748b;
        margin-bottom: 32px;
        font-size: 18px;
      }

      .section {
        background: white;
        padding: 40px;
        border-radius: 24px;
        margin-bottom: 48px;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
        border: 1px solid #e2e8f0;
      }
      h2 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }
      .color-card {
        border-radius: 16px;
        overflow: hidden;
        background: white;
        border: 1px solid #f1f5f9;
        transition: transform 0.2s;
      }
      .color-card:hover {
        transform: translateY(-4px);
      }
      .color-swatch {
        height: 80px;
        width: 100%;
      }
      .color-info {
        padding: 12px;
        font-size: 13px;
      }
      .color-name {
        font-weight: 600;
        margin-bottom: 2px;
      }
      .color-hex {
        color: #94a3b8;
        font-family: monospace;
        font-size: 11px;
      }

      /* Brand Comparison */
      .brand-comparison {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        margin-top: 24px;
      }
      .mode-preview {
        padding: 32px;
        border-radius: 20px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        min-height: 400px;
      }
      .mode-label {
        font-weight: 800;
        margin-bottom: 24px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 12px;
        opacity: 0.8;
      }

      /* Mock UI Elements */
      .mock-ui {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .mock-button {
        padding: 14px 24px;
        border-radius: 12px;
        font-weight: 700;
        text-align: center;
        cursor: pointer;
        border: none;
        font-size: 15px;
        transition: filter 0.2s;
      }
      .mock-button:active {
        filter: brightness(0.9);
      }
      .mock-card {
        padding: 24px;
        border-radius: 16px;
        border-width: 1px;
        border-style: solid;
      }
      .mock-text-primary {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .mock-text-secondary {
        font-size: 15px;
        opacity: 0.7;
        line-height: 1.6;
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
        overflow-x: auto;
        padding: 4px;
      }
      .tab {
        padding: 10px 24px;
        background: white;
        border-radius: 100px;
        cursor: pointer;
        white-space: nowrap;
        font-weight: 600;
        font-size: 15px;
        border: 1px solid #e2e8f0;
        transition: all 0.2s;
        color: #64748b;
      }
      .tab:hover {
        border-color: #cbd5e1;
        color: #1e293b;
      }
      .tab.active {
        background: #1e293b;
        color: white;
        border-color: #1e293b;
        box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2);
      }

      @media (max-width: 900px) {
        .brand-comparison {
          grid-template-columns: 1fr;
        }
        body {
          padding: 20px;
        }
        .section {
          padding: 24px;
        }
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

      <div class="tab" onclick="showBrand('stone')">Stone</div>
      <div class="tab" onclick="showBrand('butter')">Butter</div>
      <div class="tab" onclick="showBrand('chocolate')">Chocolate</div>
      <div class="tab" onclick="showBrand('matcha')">Matcha</div>
      <div class="tab" onclick="showBrand('gothic')">Gothic</div>
      <div class="tab" onclick="showBrand('y2k')">Y2K</div>

      function showBrand(id) {
        document
          .querySelectorAll('.tab')
          .forEach((t) => t.classList.remove('active'));
        const activeTab = Array.from(document.querySelectorAll('.tab')).find(
          (t) => t.innerText.toLowerCase() === id
        );
        if (activeTab) activeTab.classList.add('active');

        const brand = brands[id];
        const content = `
                <div class="section">
                    <h2>Brand: ${brand.name}</h2>
                    <p class="subtitle">${brand.description}</p>
                    
                    <div class="brand-comparison">
                        <div class="mode-preview" style="background: ${brand.light.bg}; color: ${brand.light.text}; border-color: ${brand.light.border};">
                            <div class="mode-label" style="color: ${brand.light.secondary};">Light Mode</div>
                            <div class="mock-ui">
                                <button class="mock-button" style="background: ${brand.brand}; color: ${brand.light.onBrand};">Primary Action</button>
                                <button class="mock-button" style="background: ${brand.accent}; color: ${brand.light.onAccent};">Secondary Action</button>
                                <div class="mock-card" style="background: ${brand.light.surface}; border-color: ${brand.light.border};">
                                    <div class="mock-text-primary">Clean Interface</div>
                                    <div class="mock-text-secondary">Using ${brand.name} palette for a professional mobile experience. Focus on legibility and hierarchy.</div>
                                </div>
                            </div>
                        </div>

                        <div class="mode-preview" style="background: ${brand.dark.bg}; color: ${brand.dark.text}; border-color: ${brand.dark.border};">
                            <div class="mode-label" style="color: ${brand.dark.secondary};">Dark Mode</div>
                            <div class="mock-ui">
                                <button class="mock-button" style="background: ${brand.brand}; color: ${brand.dark.onBrand};">Primary Action</button>
                                <button class="mock-button" style="background: ${brand.accent}; color: ${brand.dark.onAccent};">Secondary Action</button>
                                <div class="mock-card" style="background: ${brand.dark.surface}; border-color: ${brand.dark.border};">
                                    <div class="mock-text-primary">Dark Depth</div>
                                    <div class="mock-text-secondary">High contrast accessibility for low-light environments. Refined surface layering.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        document.getElementById('brandContent').innerHTML = content;
      }

      const primitives = [
        { name: 'Blue', hex: '#0064E0' },
        { name: 'Green', hex: '#0D8626' },
        { name: 'Orange', hex: '#EB6E00' },
        { name: 'Purple', hex: '#6B1EFD' },
        { name: 'Red', hex: '#E3193B' },
        { name: 'Teal', hex: '#08A3A3' },
        { name: 'Ink', hex: '#15110C' },
        { name: 'Paper', hex: '#FFFFFF' },
      ];

      const grid = document.getElementById('primitive-grid');
      primitives.forEach((p) => {
        grid.innerHTML += `
                <div class="color-card">
                    <div class="color-swatch" style="background: ${p.hex}"></div>
                    <div class="color-info">
                        <div class="color-name">${p.name}</div>
                        <div class="color-hex">${p.hex}</div>
                    </div>
                </div>
            `;
      });

      showBrand('neutral');
    </script>

</html>
